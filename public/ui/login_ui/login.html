<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOGIN</title>
    <!-- FontAwesome cung cấp các icon qua thẻ i-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- font Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/ui/login_ui/Login.css" />
  </head>
  <body>
    <div class="login-wrapper">
      <!-- Phần Form nhập liệu -->
      <div class="login-right">
        <div class="form-header">
          <h2>Đăng nhập</h2>
          <p>Nhập Mã sinh viên và Mật khẩu của bạn</p>
        </div>

        <form id="loginForm">
          <!-- Mã sinh viên -->
          <div class="input-group">
            <label class="student-id">Mã sinh viên</label>
            <div class="input-wrapper">
              <!-- Icon người dùng -->
              <i class="fa-solid fa-user icon-left"></i>
              <input type="text" id="student-id" placeholder="Ví dụ: 28A404999" required />
            </div>
          </div>

          <!-- Mật khẩu -->
          <div class="input-group">
            <label for="password">Mật khẩu</label>
            <div class="input-wrapper">
              <!-- Icon ổ khóa -->
              <i class="fa-solid fa-lock icon-left"></i>
              <input type="password" id="password" placeholder="Nhập mật khẩu" required />
              <!-- Icon con mắt -->
              <i class="fa-solid fa-eye-slash icon-right" id="togglePassword"></i>
            </div>
          </div>

          <!-- Các tùy chọn phụ -->
          <div class="form-actions">
            <label class="remember-me"> <input type="checkbox" /> Ghi nhớ thiết bị </label>
            <a href="#" class="forgot-password">Quên mật khẩu?</a>
          </div>

          <div class="error-msg" id="errorMsg"></div>

          <!-- Nút Submit -->
          <button type="submit" class="btn-login">Đăng nhập</button>
        </form>

        <!-- Thông báo đợt đăng ký -->
        <div class="system-notice">
          <!-- Icon thông báo -->
          <strong><i class="fa-solid fa-circle-info"></i> Thông báo:</strong> Chưa có đợt đăng ký đâu vào làm gì :().
        </div>
      </div>
    </div>
    <script src="/ui/js/login.js"></script>
  </body>
</html>
